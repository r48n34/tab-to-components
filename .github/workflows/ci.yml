name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, type-check, test and package check
    runs-on: ubuntu-latest
    steps:
      # v5 actions and pnpm/action-setup v6 run on the Node 24 action runtime,
      # so the runner no longer has to force them off the deprecated Node 20
      # runtime (the "Node.js 20 is deprecated" notice).
      - uses: actions/checkout@v5

      # No `version` here on purpose: pnpm/action-setup reads the exact
      # version from `packageManager` in package.json. Specifying both makes
      # the action fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6

      # React Router 8.5 requires Node >=22.22.0; the `22` channel resolves to
      # the latest 22.x release on the runner.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            compat/react18/pnpm-lock.yaml
            compat/react18-rr6/pnpm-lock.yaml
            compat/react19-rr6/pnpm-lock.yaml
            compat/remix2-react18/pnpm-lock.yaml
            compat/astro-react18/pnpm-lock.yaml
            compat/astro-react19/pnpm-lock.yaml
            compat/vike-react19/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install isolated compatibility workspaces
        run: pnpm install:compat

      - name: Build, type-check, tests, Vite matrix, compatibility matrix and package verification
        run: pnpm gate

  # The browser-extension port is independent of the Vite plugin's build, so it
  # gets its own job: typecheck, unit/integration tests (happy-dom, no browser),
  # production Plasmo build and a manifest/bundle contract check.
  extension:
    name: Chrome extension (typecheck, tests, build, manifest check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter tab-to-components-extension typecheck

      - name: Tests
        run: pnpm --filter tab-to-components-extension test

      - name: Production build
        run: pnpm --filter tab-to-components-extension build

      - name: Verify manifest and bundles
        run: node packages/tab-to-components-extension/scripts/verify-build.mjs

  # The end-to-end suite drives a real browser. It runs locally with
  # `pnpm e2e`; enable this job if you want it in CI (the runner ships Chrome).
  # e2e:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: pnpm/action-setup@v6
  #     - uses: actions/setup-node@v5
  #       with: { node-version: 22, cache: pnpm }
  #     - run: pnpm install --frozen-lockfile
  #     - run: CHROME_PATH=/usr/bin/google-chrome pnpm e2e
